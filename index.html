<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contemporary Classical Explorer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f4f2;
      --card: #ffffff;
      --text: #1f1f1f;
      --muted: #5b5b5b;
      --accent: #2d6cdf;
      --accent-soft: #e8effb;
      --border: #d8d8d8;
    }

    * {
      box-sizing: border-box;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 48px 16px 24px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 2.6rem);
    }

    header p {
      margin: 0 auto;
      max-width: 760px;
      color: var(--muted);
      line-height: 1.5;
    }

    main {
      max-width: 1100px;
      margin: 0 auto 64px;
      padding: 0 16px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.05);
    }

    .controls {
      display: grid;
      gap: 16px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .control-row label {
      font-weight: 600;
    }

    input[type="text"],
    select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
      min-width: 200px;
    }

    .view-toggle {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-toggle button {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 16px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-toggle button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .composer-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .composer-card {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #fff;
      display: grid;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .composer-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      padding: 12px 16px;
      border-left: 4px solid var(--accent);
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .movement-group {
      display: grid;
      gap: 16px;
    }

    .movement-group h3 {
      margin-bottom: 4px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 10;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
    }

    .modal-header h2 {
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.6rem;
      cursor: pointer;
      color: var(--muted);
    }

    .section {
      margin-top: 20px;
    }

    .section h3 {
      margin: 0 0 8px;
    }

    .keywork {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fafafa;
      margin-bottom: 8px;
    }

    .resource {
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fdfdfd;
      margin-bottom: 8px;
    }

    .resource a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .summary-line {
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      header {
        padding-top: 32px;
      }

      .modal-content {
        padding: 18px;
      }
    }
  </style>
</head>

          <button data-view="movement">By Movement</button>
        </div>
      </div>
    </section>

    <section id="viewContainer" class="card"></section>
  </main>

  </div>

      optionAll.value = "all";
      optionAll.textContent = "All";
      select.appendChild(optionAll);

      values.forEach((value) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
    };

    const uniqueValues = (key) => {
      return [...new Set(COMPOSERS_DATA.map((composer) => composer[key]).filter(Boolean))].sort();
    };

    buildFilterOptions(movementFilter, uniqueValues("movement"));
    buildFilterOptions(tendencyFilter, uniqueValues("tendency"));
    buildFilterOptions(difficultyFilter, uniqueValues("difficulty"));

    const matchesFilters = (composer) => {
      const query = state.search.toLowerCase();
      const inSearch =
        composer.name.toLowerCase().includes(query) ||
        composer.movement.toLowerCase().includes(query) ||
        composer.nationality.toLowerCase().includes(query) ||
        composer.tendency.toLowerCase().includes(query);

      return (
        (state.search === "" || inSearch) &&
        (state.movement === "all" || composer.movement === state.movement) &&
        (state.tendency === "all" || composer.tendency === state.tendency) &&
        (state.difficulty === "all" || composer.difficulty === state.difficulty)
      );
    };

    const getFilteredComposers = () => {
      return COMPOSERS_DATA.filter(matchesFilters);
    };

    const composerMap = Object.fromEntries(COMPOSERS_DATA.map((composer) => [composer.id, composer]));

    const renderGrid = (composers) => {
      const grid = document.createElement("div");
      grid.className = "composer-grid";
      composers.forEach((composer) => {
        const card = document.createElement("div");
        card.className = "composer-card";
        card.innerHTML = `
          <strong>${composer.name}</strong>
          <div class="summary-line">${composer.dates} • ${composer.nationality}</div>
          <div class="summary-line">${composer.movement}</div>
          <span class="tag">${composer.tendency}</span>
        `;
        card.addEventListener("click", () => openModal(composer));
        grid.appendChild(card);
      });
      viewContainer.appendChild(grid);
    };

    const renderTimeline = (composers) => {
      const timeline = document.createElement("div");
      timeline.className = "timeline";
      composers
        .sort((a, b) => getStartYear(a.dates) - getStartYear(b.dates))
        .forEach((composer) => {
          const item = document.createElement("div");
          item.className = "timeline-item";
          item.innerHTML = `
            <strong>${composer.name}</strong>
            <div class="summary-line">${composer.dates} • ${composer.movement}</div>
            <div class="summary-line">${composer.tendency} • ${composer.nationality}</div>
          `;
          item.addEventListener("click", () => openModal(composer));
          timeline.appendChild(item);
        });
      viewContainer.appendChild(timeline);
    };

    const renderByMovement = (composers) => {
      const groups = {};
      composers.forEach((composer) => {
        if (!groups[composer.movement]) {
          groups[composer.movement] = [];
        }
        groups[composer.movement].push(composer);
      });

      Object.entries(groups)
        .sort(([a], [b]) => a.localeCompare(b))
        .forEach(([movement, group]) => {
          const section = document.createElement("div");
          section.className = "movement-group";
          section.innerHTML = `<h3>${movement}</h3>`;
          const grid = document.createElement("div");
          grid.className = "composer-grid";
          group.forEach((composer) => {
            const card = document.createElement("div");
            card.className = "composer-card";
            card.innerHTML = `
              <strong>${composer.name}</strong>
              <div class="summary-line">${composer.dates} • ${composer.nationality}</div>
              <span class="tag">${composer.tendency}</span>
            `;
            card.addEventListener("click", () => openModal(composer));
            grid.appendChild(card);
          });
          section.appendChild(grid);
          viewContainer.appendChild(section);
        });
    };

    const resourceIcon = (type) => {
      switch (type) {
        case "analysis":
          return "📚";
        case "interview":
          return "🎙️";
        case "score":
          return "📄";
        case "video":
          return "🎬";
        case "essay":
          return "📝";
        default:
          return "🔗";
      }
    };

    const openModal = (composer) => {
      modalName.textContent = composer.name;
      modalMeta.textContent = `${composer.dates} • ${composer.nationality} • ${composer.movement}`;
      modalDescription.textContent = composer.description;

      modalTags.innerHTML = `
        <span class="tag">${composer.tendency}</span>
        <span class="tag">Difficulty: ${composer.difficulty}</span>
      `;

      modalWorks.innerHTML = "";
      composer.keyWorks.forEach((work) => {
        const workEl = document.createElement("div");
        workEl.className = "keywork";
        workEl.innerHTML = `
          <strong>${work.title}</strong> (${work.year})<br />
          <span class="summary-line">Recommended: ${work.recommendedRecording || "TBD"}</span><br />
          <a href="${work.spotify}" target="_blank" rel="noreferrer">Open on Spotify</a>
        `;
        modalWorks.appendChild(workEl);
      });

      const influenceNames = (ids) => ids.map((id) => composerMap[id]?.name).filter(Boolean);
      const influences = influenceNames(composer.influences);
      const influenced = influenceNames(composer.influenced);
      modalInfluence.innerHTML = `
        <div class="summary-line"><strong>Influenced by:</strong> ${influences.length ? influences.join(", ") : "—"}</div>
        <div class="summary-line" style="margin-top:6px;"><strong>Influenced:</strong> ${influenced.length ? influenced.join(", ") : "—"}</div>
      `;

      modalResources.innerHTML = "";
      if (!composer.resources || composer.resources.length === 0) {
        modalResources.innerHTML = `<div class="summary-line">No curated resources yet.</div>`;
      } else {
        composer.resources.forEach((resource) => {
          const resourceEl = document.createElement("div");
          resourceEl.className = "resource";
          resourceEl.innerHTML = `
            <div><strong>${resourceIcon(resource.type)} ${resource.title}</strong> <span class="summary-line">(${resource.type})</span></div>
            <div class="summary-line">${resource.description}</div>
            <a href="${resource.url}" target="_blank" rel="noreferrer">Open resource</a>
          `;
          modalResources.appendChild(resourceEl);
        });
      }

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    };

    const closeModalHandler = () => {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    };

    closeModal.addEventListener("click", closeModalHandler);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModalHandler();
      }
    });

    const renderView = () => {
      viewContainer.innerHTML = "";
      const composers = getFilteredComposers();
      resultCount.textContent = `${composers.length} composers`;

      if (composers.length === 0) {
        const emptyState = document.createElement("div");
        emptyState.className = "summary-line";
        emptyState.textContent = "No composers found. Try adjusting your search or filters.";
        viewContainer.appendChild(emptyState);
        return;
      }

      if (state.view === "timeline") {
        renderTimeline(composers);
      } else if (state.view === "movement") {
        renderByMovement(composers);
      } else {
        renderGrid(composers);
      }
    };

    document.querySelectorAll(".view-toggle button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".view-toggle button").forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        state.view = button.dataset.view;
        renderView();
      });
    });

    searchInput.addEventListener("input", (event) => {
      state.search = event.target.value.trim();
      renderView();
    });

    movementFilter.addEventListener("change", (event) => {
      state.movement = event.target.value;
      renderView();
    });

    tendencyFilter.addEventListener("change", (event) => {
      state.tendency = event.target.value;
      renderView();
    });

    difficultyFilter.addEventListener("change", (event) => {
      state.difficulty = event.target.value;
      renderView();
    });

    renderView();
  </script>
</body>
</html>
